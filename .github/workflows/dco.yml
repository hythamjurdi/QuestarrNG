name: DCO

on:
  pull_request:
    branches: [main, "release/*"]

permissions:
  contents: read

jobs:
  dco:
    name: Verify sign-offs
    # GitHub-verified automation accounts cannot provide a human DCO attestation.
    if: github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout full pull-request history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.x
          package-manager-cache: false

      - name: Verify DCO sign-offs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/check-dco.mjs --base "$BASE_SHA" --head "$HEAD_SHA"
